name: CI

on:
  push:
    branches: [main, feat/web-pwa]
  pull_request:

jobs:
  electron:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # postinstall skips native rebuild when CI=true; tests need better-sqlite3
      - run: npx electron-builder install-app-deps
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      # src/core imports lodash/xlsx/date-fns; tsc resolves those from the
      # repo root (parent of src/core), not apps/web/node_modules. ignore-
      # scripts skips better-sqlite3 native compile — web does not need it.
      - run: npm ci --ignore-scripts
      - run: npm ci
        working-directory: apps/web
      - run: npm run typecheck
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web
