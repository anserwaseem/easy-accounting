<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2f6fed" />
    <meta
      name="description"
      content="Easy Accounting — offline-capable accounting app."
    />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <title>Easy Accounting (web)</title>
  </head>
  <body style="margin: 0; background: #020817; color: #e2e8f0">
    <div id="root">
      <div
        style="
          min-height: 100vh;
          display: flex;
          align-items: center;
          justify-content: center;
          font-family: system-ui, sans-serif;
          font-size: 0.95rem;
          opacity: 0.75;
        "
      >
        Starting…
      </div>
    </div>
    <!-- Capture `#join=` before the bundle (or a service-worker reload)
         can drop it. Key must stay in lockstep with JOIN_HASH_SESSION_KEY
         in src/renderer/lib/joinLink.ts. -->
    <script>
      try {
        var h = location.hash || '';
        if (h.indexOf('#join=') === 0 || h.indexOf('#/join=') === 0) {
          sessionStorage.setItem('easyAccounting.joinHash', h);
        }
      } catch (e) {}
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
