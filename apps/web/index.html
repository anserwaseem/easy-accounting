<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the app draw under the notch/home indicator;
         the shell adds the matching env(safe-area-inset-*) padding. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="theme-color"
      content="#ffffff"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#0e1626"
      media="(prefers-color-scheme: dark)"
    />
    <meta
      name="description"
      content="Easy Accounting — offline-capable accounting app."
    />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180.png" />
    <title>Easy Accounting</title>
    <!--
      Theme is resolved BEFORE first paint, not in ThemeProvider's effect.
      The provider only re-applies the class on change, so without this the
      PWA painted one flash of the wrong theme on every cold start.
      Keep the storage key ('ui-theme') in lockstep with
      src/renderer/hooks/useTheme.tsx.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('ui-theme');
          var theme =
            stored === 'dark' || stored === 'light'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          var root = document.documentElement;
          root.classList.remove('light', 'dark');
          root.classList.add(theme);
          root.style.colorScheme = theme;
        } catch (e) {
          document.documentElement.classList.add('light');
        }
      })();
    </script>
    <style>
      /* Boot splash colors, so the pre-bundle frame matches the theme that
         was just resolved above instead of flashing the opposite one. The
         real design tokens arrive with App.global.css once the bundle
         loads; these only cover that first frame. */
      html,
      body {
        margin: 0;
        background: #ffffff;
        color: #0f172a;
      }
      html.dark,
      html.dark body {
        background: #0e1626;
        color: #e2e8f0;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div
        style="
          min-height: 100vh;
          display: flex;
          align-items: center;
          justify-content: center;
          font-family: system-ui, sans-serif;
          font-size: 0.95rem;
          opacity: 0.75;
        "
      >
        Starting…
      </div>
    </div>
    <!-- Capture `#join=` before the bundle (or a service-worker reload)
         can drop it. Key must stay in lockstep with JOIN_HASH_SESSION_KEY
         in src/renderer/lib/joinLink.ts. -->
    <script>
      try {
        var h = location.hash || '';
        if (h.indexOf('#join=') === 0 || h.indexOf('#/join=') === 0) {
          sessionStorage.setItem('easyAccounting.joinHash', h);
        }
      } catch (e) {}
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
